[project]
name = "rl-visualizer"
version = "0.1.0"
description = "RL Visualizer"
authors = [
    {name = "Tom"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "polars>=1.31.0",
    'torch<=2.1.2; sys_platform == "darwin" and platform_machine == "x86_64"',
    'torch>=2.0.0; sys_platform != "darwin" or platform_machine != "x86_64"',
    'transformers>=4.50.0',
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
